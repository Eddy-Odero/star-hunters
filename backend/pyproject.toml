[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-hunters-backend"
version = "0.1.0"
description = "Star Hunters (Planet X & SPHEREx Blinker) FastAPI Backend & Scientific Pipeline"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn[standard]>=0.29.0,<1.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "numpy>=1.26.0",
  "astropy>=6.0.0",
  "reproject>=0.13.0",
  "astroquery>=0.4.7",
  "pyvo>=1.5.0",
  "httpx>=0.27.0",
  "jsonschema>=4.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
