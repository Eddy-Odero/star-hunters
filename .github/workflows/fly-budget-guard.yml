name: Fly.io Monthly Budget Guard

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check usage without scaling down the machine"
        type: boolean
        required: false
        default: false
      max_monthly_hours:
        description: "Override active-hours cap for this run (default: vars.MAX_MONTHLY_HOURS or 75)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fly-budget-guard
  cancel-in-progress: false

jobs:
  budget-guard:
    name: Check Fly.io Month-to-Date Uptime
    runs-on: ubuntu-latest
    steps:
      - name: Check Fly.io token configuration
        id: token_check
        env:
          FLY_METRICS_TOKEN: ${{ secrets.FLY_METRICS_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_METRICS_TOKEN" ]; then
            echo "::notice::FLY_METRICS_TOKEN secret is not set. Skipping Fly.io budget check. Run: fly tokens create readonly -o personal -n \"gh-budget-guard\" -x 8760h | gh secret set FLY_METRICS_TOKEN --repo ${{ github.repository }}"
            echo "has_metrics_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_metrics_token=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "has_deploy_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Query Fly Prometheus month-to-date uptime
        id: usage_check
        if: steps.token_check.outputs.has_metrics_token == 'true'
        env:
          FLY_METRICS_TOKEN: ${{ secrets.FLY_METRICS_TOKEN }}
          FLY_ORG_SLUG: ${{ vars.FLY_ORG_SLUG || 'personal' }}
          FLY_APP_NAME: "star-hunters-spherex"
          INPUT_MAX_HOURS: ${{ inputs.max_monthly_hours }}
          VAR_MAX_HOURS: ${{ vars.MAX_MONTHLY_HOURS }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["FLY_METRICS_TOKEN"].strip()
          org_slug = os.environ.get("FLY_ORG_SLUG", "personal").strip() or "personal"
          app_name = os.environ["FLY_APP_NAME"]
          raw_limit = (os.environ.get("INPUT_MAX_HOURS") or os.environ.get("VAR_MAX_HOURS") or "75").strip()
          max_monthly_hours = float(raw_limit)
          dry_run = os.environ.get("DRY_RUN", "").lower() == "true"

          auth_header = token if token.startswith(("FlyV1 ", "Bearer ")) else f"Bearer {token}"
          base_url = f"https://api.fly.io/prometheus/{urllib.parse.quote(org_slug)}/api/v1/query_range"

          now = datetime.datetime.now(datetime.timezone.utc)
          month_start = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          start_ts = int(month_start.timestamp())
          end_ts = int(now.timestamp())

          active_samples: set[tuple[str, int]] = set()
          chunk_seconds = 7 * 86400
          promql = f'max_over_time(fly_instance_up{{app="{app_name}"}}[1m])'

          cursor = start_ts
          while cursor + 60 <= end_ts:
              chunk_end = min(cursor + chunk_seconds, end_ts)
              query = urllib.parse.urlencode(
                  {
                      "query": promql,
                      "start": str(cursor),
                      "end": str(chunk_end),
                      "step": "60",
                  }
              )
              req = urllib.request.Request(
                  f"{base_url}?{query}",
                  headers={"Authorization": auth_header},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              if payload.get("status") != "success":
                  raise RuntimeError(f"Prometheus query failed: {payload}")
              for series in payload.get("data", {}).get("result", []):
                  inst = str(series.get("metric", {}).get("instance", "default"))
                  for ts_raw, val_raw in series.get("values", []):
                      if float(val_raw) > 0.0:
                          active_samples.add((inst, int(round(float(ts_raw)))))
              cursor = chunk_end

          by_day: collections.Counter[str] = collections.Counter()
          for _inst, ts_sec in active_samples:
              day_str = datetime.datetime.fromtimestamp(ts_sec, datetime.timezone.utc).strftime("%Y-%m-%d")
              by_day[day_str] += 1

          total_minutes = len(active_samples)
          active_hours = total_minutes / 60.0
          compute_usd = active_hours * 0.049
          fixed_usd = 0.30
          est_total_usd = compute_usd + fixed_usd
          exceeded = active_hours >= max_monthly_hours

          lines = [
              f"## Fly.io Monthly Budget Guard (`{app_name}`)",
              "",
              f"- **Month window (UTC):** `{month_start.strftime('%Y-%m-%d')}` to `{now.strftime('%Y-%m-%d %H:%M UTC')}`",
              f"- **Active uptime:** `{active_hours:.2f} hrs` (`{total_minutes} min`) / `{max_monthly_hours:.2f} hrs` cap",
              f"- **Estimated spend:** `~${est_total_usd:.2f}` (`${compute_usd:.2f}` compute @ `$0.049/hr` + `${fixed_usd:.2f}` storage)",
              f"- **Cap exceeded:** `{str(exceeded).lower()}` (dry_run=`{str(dry_run).lower()}`)",
              "",
              "| Date (UTC) | Active Minutes | Active Hours |",
              "| :--- | ---: | ---: |",
          ]
          if by_day:
              for day in sorted(by_day):
                  mins = by_day[day]
                  lines.append(f"| {day} | {mins} | {mins / 60.0:.2f} |")
          else:
              lines.append("| _(no active samples)_ | 0 | 0.00 |")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"exceeded={str(exceeded).lower()}\n")
                  fh.write(f"active_hours={active_hours:.2f}\n")
          PY

      - name: Verify Fly.io deploy token when shutdown is required
        if: >-
          steps.usage_check.outputs.exceeded == 'true' &&
          inputs.dry_run != true &&
          steps.token_check.outputs.has_deploy_token != 'true'
        run: |
          echo "::warning::Monthly uptime (${{ steps.usage_check.outputs.active_hours }} hrs) exceeded the budget threshold, but FLY_API_TOKEN is not configured so automatic scale-to-0 could not run."
          exit 1

      - name: Setup flyctl
        if: >-
          steps.usage_check.outputs.exceeded == 'true' &&
          inputs.dry_run != true &&
          steps.token_check.outputs.has_deploy_token == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Hard-stop Fly.io machine (scale count 0)
        if: >-
          steps.usage_check.outputs.exceeded == 'true' &&
          inputs.dry_run != true &&
          steps.token_check.outputs.has_deploy_token == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl scale count 0 -y -a star-hunters-spherex
          {
            echo ""
            echo "### Action Taken: Hard Stop Executed"
            echo "Scaled \`star-hunters-spherex\` to \`0\` machines because active hours reached \`${{ steps.usage_check.outputs.active_hours }}\`."
            echo "Incoming HTTP requests will no longer wake the VM. To bring it back online later, run \`flyctl scale count 1 -a star-hunters-spherex\` or trigger a new \`flyctl deploy\`."
          } >> "$GITHUB_STEP_SUMMARY"
