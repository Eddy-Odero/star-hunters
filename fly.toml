app = "star-hunters-spherex"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SQLITE_DB_PATH = "/data/spherex_cache.db"
  ENABLE_ARCHIVAL_DATA = "true"
  LOG_LEVEL = "INFO"
  LOG_FORMAT = "text"

[[mounts]]
  source = "spherex_cache_vol"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
